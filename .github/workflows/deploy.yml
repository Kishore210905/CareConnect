name: CareConnect CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: careconnect
  ASG_NAME: careconnect-asg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APP_VERSION="$(cat VERSION)+${SHORT_SHA}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --build-arg APP_VERSION="$APP_VERSION" -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

      - name: Start ASG instance refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' \
            --query InstanceRefreshId --output text)
          echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"

      - name: Wait for refresh to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Refresh status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|Cancelling) exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for refresh"; exit 1
